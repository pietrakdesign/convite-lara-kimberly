<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071f3d" />
  <meta name="color-scheme" content="light only" />
  <title>15 anos - Lara Kimberly</title>
  <style>
    :root {
      --navy: #071f3d;
      --blue: #0d7dcc;
      --gold: #d7a316;
      --ease-premium: cubic-bezier(.22,.72,.2,1);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(24,78,126,.28), transparent 52%),
        #04152a;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .invitation {
      position: relative;
      width: min(100vw, calc(100dvh * 9 / 16));
      aspect-ratio: 9 / 16;
      max-height: 100dvh;
      overflow: hidden;
      background: var(--navy);
      box-shadow: 0 22px 70px rgba(0,0,0,.4);
      isolation: isolate;
    }

    .page {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(0);
      transition: opacity .55s var(--ease-premium), transform .65s var(--ease-premium), filter .6s ease;
      z-index: 1;
    }

    .page > img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      pointer-events: none;
    }

    .page.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      z-index: 4;
    }

    /* Page 2 appears from the centre with a soft blur after the envelope opens. */
    #page2.revealing {
      visibility: visible;
      opacity: 1;
      z-index: 2;
      animation: invitationReveal 1.35s .14s both var(--ease-premium);
    }

    @keyframes invitationReveal {
      0% {
        clip-path: inset(0 49.4% 0 49.4% round 8px);
        filter: blur(18px) brightness(1.15);
        transform: scale(.94);
        opacity: .25;
      }
      48% {
        filter: blur(7px) brightness(1.08);
        opacity: .9;
      }
      100% {
        clip-path: inset(0 0 0 0 round 0);
        filter: blur(0) brightness(1);
        transform: scale(1);
        opacity: 1;
      }
    }

    .reveal-glow {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 50%;
      width: 3.5%;
      height: 100%;
      transform: translateX(-50%) scaleX(.15);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.72), rgba(244,202,86,.36), transparent);
      filter: blur(9px);
      opacity: 0;
      pointer-events: none;
    }

    .opening .reveal-glow {
      animation: glowOpen 1.05s .2s both ease-out;
    }

    @keyframes glowOpen {
      0% { opacity: 0; transform: translateX(-50%) scaleX(.12); }
      30% { opacity: .9; }
      100% { opacity: 0; transform: translateX(-50%) scaleX(14); }
    }

    /* Envelope cover */
    .cover {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: auto;
    }

    .door.left { left: 0; background-position: left top; }
    .door.right { right: 0; background-position: right top; }

    .seal-button {
      position: absolute;
      left: 50%;
      top: 49.78%;
      width: 31.1%;
      aspect-ratio: 666 / 688;
      padding: 0;
      border: 0;
      background: transparent;
      transform: translate(-50%, -50%);
      z-index: 13;
      cursor: pointer;
      filter: drop-shadow(0 7px 5px rgba(0,0,0,.28));
      animation: sealPulse 2.8s ease-in-out infinite;
      outline: none;
    }

    .seal-button img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }

    .seal-button::after {
      content: '';
      position: absolute;
      inset: 7%;
      border-radius: 50%;
      background: linear-gradient(115deg, transparent 32%, rgba(255,255,255,.45) 48%, transparent 62%);
      transform: translateX(-115%) rotate(-12deg);
      opacity: 0;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .seal-button:hover::after,
    .seal-button:focus-visible::after {
      animation: sealShine 1.15s ease both;
    }

    .seal-button:focus-visible {
      filter: drop-shadow(0 0 9px rgba(255,230,139,.8)) drop-shadow(0 7px 5px rgba(0,0,0,.28));
    }

    @keyframes sealPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.025); }
    }

    @keyframes sealShine {
      0% { opacity: 0; transform: translateX(-115%) rotate(-12deg); }
      25% { opacity: .75; }
      100% { opacity: 0; transform: translateX(115%) rotate(-12deg); }
    }

    .opening .seal-button {
      animation: sealRelease .48s both ease-in;
      pointer-events: none;
    }

    .opening .door.left  { animation: openLeft 1.15s .22s both var(--ease-premium); }
    .opening .door.right { animation: openRight 1.15s .22s both var(--ease-premium); }

    @keyframes sealRelease {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; filter: drop-shadow(0 7px 5px rgba(0,0,0,.28)); }
      40% { transform: translate(-50%, -50%) scale(1.07) rotate(1deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(.78) rotate(-3deg); opacity: 0; filter: blur(2px); }
    }

    @keyframes openLeft {
      0% { transform: translateX(0); filter: brightness(1); }
      100% { transform: translateX(-103%); filter: brightness(.76); }
    }

    @keyframes openRight {
      0% { transform: translateX(0); filter: brightness(1); }
      100% { transform: translateX(103%); filter: brightness(.76); }
    }

    /* Invisible interactive areas follow the artwork precisely. */
    .hotspot {
      position: absolute;
      z-index: 7;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      outline: none;
      transition: transform .13s ease, background-color .16s ease, box-shadow .16s ease;
    }

    .hotspot:hover,
    .hotspot:focus-visible {
      background: rgba(17,127,201,.055);
      box-shadow: 0 0 0 3px rgba(17,127,201,.12), 0 0 25px rgba(17,127,201,.14);
    }
    .hotspot:active { transform: scale(.955); }

    /* Page 2: three icons */
    .confirm { left: 10.2%; top: 65.2%; width: 24.3%; height: 15.2%; }
    .location { left: 37.8%; top: 65.2%; width: 24.3%; height: 15.2%; }
    .gift { left: 65.2%; top: 65.2%; width: 24.3%; height: 15.2%; }

    /* Page 3: back button */
    .back {
      left: 9.5%;
      top: 87.75%;
      width: 18.7%;
      height: 4.2%;
      border-radius: 999px;
    }

    /* Internal page transitions */
    .page.exit-left { visibility: visible; opacity: 0; transform: translateX(-9%); pointer-events: none; z-index: 3; }
    .page.exit-right { visibility: visible; opacity: 0; transform: translateX(9%); pointer-events: none; z-index: 3; }
    .page.enter-right { visibility: visible; opacity: 0; transform: translateX(9%); z-index: 4; }
    .page.enter-left { visibility: visible; opacity: 0; transform: translateX(-9%); z-index: 4; }

    .screen-reader {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-aspect-ratio: 9/16) {
      .invitation { width: 100vw; height: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

  <main class="stage" aria-label="Convite interativo de 15 anos de Lara Kimberly">

  <script>
    (() => {
      const invitation = document.getElementById('invitation');
      const cover = document.getElementById('cover');
      const sealButton = document.getElementById('sealButton');
      const page2 = document.getElementById('page2');
      const page3 = document.getElementById('page3');
      const gift = document.querySelector('.gift');
      const back = document.querySelector('.back');
      let opened = false;
      let currentPage = 1;
      let transitioning = false;

      function openInvitation() {
        if (opened) return;
        opened = true;
        invitation.classList.add('opening');
        page2.classList.add('revealing');

        window.setTimeout(() => {
          cover.style.display = 'none';
          invitation.classList.remove('opening');
          page2.classList.remove('revealing');
          page2.classList.add('active');
          currentPage = 2;
          try { history.replaceState({ invitePage: 2 }, '', location.href); } catch (_) {}
        }, 1580);
      }

      function switchPage(target, direction = 'forward', pushHistory = true) {
        if (transitioning || target === currentPage || !opened) return;
        transitioning = true;

        const from = currentPage === 2 ? page2 : page3;
        const to = target === 2 ? page2 : page3;

        const exitClass = direction === 'forward' ? 'exit-left' : 'exit-right';
        const enterClass = direction === 'forward' ? 'enter-right' : 'enter-left';

        to.classList.remove('exit-left', 'exit-right', 'enter-left', 'enter-right');
        to.classList.add(enterClass);
        to.style.visibility = 'visible';
        to.style.pointerEvents = 'none';

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            from.classList.remove('active', 'enter-left', 'enter-right');
            from.classList.add(exitClass);
            to.classList.remove(enterClass);
            to.classList.add('active');
          });
        });

        window.setTimeout(() => {
          from.classList.remove(exitClass);
          from.style.visibility = '';
          from.style.pointerEvents = '';
          to.style.visibility = '';
          to.style.pointerEvents = '';
          currentPage = target;
          transitioning = false;
          if (pushHistory) {
            try { history.pushState({ invitePage: target }, '', location.href); } catch (_) {}
          }
        }, 700);
      }

      sealButton.addEventListener('click', openInvitation);
      gift.addEventListener('click', () => switchPage(3, 'forward', true));
      back.addEventListener('click', () => switchPage(2, 'back', false));

      window.addEventListener('popstate', (event) => {
        if (!opened || transitioning) return;
        const target = event.state && event.state.invitePage === 3 ? 3 : 2;
        if (target !== currentPage) switchPage(target, target === 3 ? 'forward' : 'back', false);
      });
    })();
  </script>
